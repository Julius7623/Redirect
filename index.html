<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>We have moved</title>
<meta name="robots" content="noindex">
<link rel="canonical" href="https://mytinytools.onrender.com/">
<noscript><meta http-equiv="refresh" content="3;url=https://mytinytools.onrender.com/"></noscript>
<script>
/* Apply theme before paint: saved choice, otherwise system theme */
(function(){
  var r=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)"),saved=null;
  try{saved=localStorage.getItem("theme")}catch(e){}
  function set(t){r.setAttribute("data-theme",t)}
  set(saved==="light"||saved==="dark"?saved:(mq.matches?"dark":"light"));
  mq.addEventListener&&mq.addEventListener("change",function(e){
    var s=null;try{s=localStorage.getItem("theme")}catch(x){}
    if(s!=="light"&&s!=="dark")set(e.matches?"dark":"light");
  });
})();
</script>
<style>
:root{
  --bg:#fbfbfd;
  --ink:#1d1d1f;
  --muted:#6e6e73;
  --line:#d2d2d7;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme]){--bg:#000;--ink:#f5f5f7;--muted:#86868b;--line:#424245}
}
:root[data-theme="light"]{--bg:#fbfbfd;--ink:#1d1d1f;--muted:#6e6e73;--line:#d2d2d7;color-scheme:light}
:root[data-theme="dark"]{--bg:#000;--ink:#f5f5f7;--muted:#86868b;--line:#424245;color-scheme:dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  display:grid;place-items:center;padding:24px;text-align:center;
  -webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;
  transition:background .25s,color .25s;
}
main{width:100%;max-width:480px}
h1{
  font-weight:600;font-size:clamp(2.25rem,9vw,3.5rem);
  line-height:1.07;letter-spacing:-.03em;
}
p{
  margin-top:16px;color:var(--muted);
  font-size:1.0625rem;line-height:1.47;letter-spacing:-.012em;
}
.dest{color:var(--ink);font-weight:500;white-space:nowrap}
.bar{
  margin:40px auto 0;height:3px;width:120px;background:var(--line);
  border-radius:3px;overflow:hidden;
}
.bar i{
  display:block;height:100%;width:100%;background:var(--ink);
  transform-origin:left;transform:scaleX(0);
  animation:fill 3s linear forwards;
}
@keyframes fill{to{transform:scaleX(1)}}
a.btn{
  display:inline-block;margin-top:32px;padding:12px 24px;
  background:var(--ink);color:var(--bg);border-radius:980px;
  text-decoration:none;font-size:1.0625rem;letter-spacing:-.012em;
  transition:opacity .2s;
}
a.btn:hover{opacity:.8}
a.btn:focus-visible,#theme:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
#theme{
  position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(16px + env(safe-area-inset-right,0px));
  width:40px;height:40px;border-radius:50%;
  display:grid;place-items:center;cursor:pointer;
  background:transparent;color:var(--ink);border:1px solid var(--line);
  transition:background .2s;
}
#theme:hover{background:var(--line)}
#theme svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#theme .sun{display:none}
:root[data-theme="dark"] #theme .sun{display:block}
:root[data-theme="dark"] #theme .moon{display:none}
@media (prefers-reduced-motion:reduce){
  .bar i{animation:none;transform:scaleX(1)}
  a.btn,#theme,body{transition:none}
}
</style>
</head>
<body>
<button id="theme" type="button" aria-label="Toggle dark mode" hidden>
  <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
</button>
<main>
  <h1>We have moved.</h1>
  <p>Our new address is <span class="dest">mytinytools.onrender.com</span>. You will be redirected automatically in 3 seconds.</p>
  <div class="bar" aria-hidden="true"><i></i></div>
  <a class="btn" id="go" href="https://mytinytools.onrender.com/">Go now</a>
</main>
<script>
(function(){
  var base="https://mytinytools.onrender.com";
  var url=base+location.pathname+location.search+location.hash;
  document.getElementById("go").href=url;
  setTimeout(function(){location.replace(url)},3000);

  var b=document.getElementById("theme"),r=document.documentElement;
  b.hidden=false;
  b.addEventListener("click",function(){
    var next=r.getAttribute("data-theme")==="dark"?"light":"dark";
    r.setAttribute("data-theme",next);
    try{localStorage.setItem("theme",next)}catch(e){}
  });
})();
</script>
</body>
</html>
